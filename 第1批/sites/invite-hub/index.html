<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --ink:#1e1c18; --muted:#726c63;
    --line:#e7e3dc; --accent:#2f6b57; --accent-soft:#e9f2ee;
    --gold:#a8701f; --gold-soft:#fbf3e2; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}

  header.top{padding:52px 0 22px;text-align:center}
  .brand{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:600;margin-bottom:14px}
  h1{font-family:"Noto Serif SC",Georgia,"Songti SC",serif;font-size:34px;margin:0 0 14px;letter-spacing:.5px;line-height:1.3}
  .lead{color:var(--muted);font-size:15px;max-width:620px;margin:0 auto}

  h2{font-size:18px;margin:44px 0 14px;padding-left:11px;border-left:4px solid var(--accent)}
  h2 .n{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px}

  /* VPN 高亮块 */
  .hl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;
    box-shadow:0 12px 30px -18px rgba(47,107,87,.35);border-top:4px solid var(--accent)}
  .hl .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .hl .head h3{margin:0;font-size:20px}
  .tag{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px}
  .codeline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
  .code{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);
    border-radius:10px;padding:8px 16px;font-size:19px;font-weight:700;cursor:pointer;
    font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;border:1px dashed transparent}
  .code:hover{border-color:var(--accent)}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;
    padding:9px 20px;border-radius:999px;font-size:14px;font-weight:600}
  .dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}
  .dl a{display:block;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:13px;color:var(--ink);text-decoration:none}
  .dl a:hover{border-color:var(--accent);color:var(--accent)}
  .dl a b{display:block;font-size:13.5px;margin-bottom:2px}
  .dl a span{color:var(--muted);font-size:12px}
  ol.steps{list-style:none;counter-reset:s;padding:0;margin:12px 0 0}
  ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 42px;border-bottom:1px solid var(--line);font-size:13.5px}
  ol.steps li:last-child{border-bottom:none}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}

  /* 分类卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px}
  .card:hover{box-shadow:0 10px 26px -16px rgba(0,0,0,.18)}
  .card .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h4{margin:0;font-size:16px}
  .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:400}
  .amount{align-self:flex-start;font-size:12.5px;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:3px 9px;font-weight:600}
  .row{font-size:13px;color:#3a3630}
  .row .k{color:var(--muted);margin-right:5px}
  .ccode{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer;font-family:ui-monospace,Consolas,monospace}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .links a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);padding:3px 11px;border-radius:8px}
  .links a:hover{background:var(--accent-soft)}
  details{font-size:12.5px;color:var(--muted)}
  details summary{cursor:pointer;list-style:none;outline:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"› ";color:var(--accent);font-weight:700}
  details[open] summary::before{content:"⌄ "}
  details p{margin:6px 0 0;padding-left:12px}

  footer{padding:34px 0 56px;text-align:center;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:44px}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$("#brand").textContent = SITE.brand;
$("#title").textContent = SITE.title;
$("#lead").textContent = SITE.lead;

/* VPN 块 */
const v = SITE.vpn;
$("#vpnName").textContent = v.name;
$("#vpnTag").textContent = v.tag || "";
$("#vpnCode").textContent = v.code;
$("#vpnCta").href = v.url;
$("#vpnDl").innerHTML = v.downloads.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener"><b>${esc(d.os)} · ${esc(d.label)}</b><span>${esc(d.note)}</span></a>`).join("");
$("#vpnSteps").innerHTML = v.steps.map(s=>`<li>${esc(s)}</li>`).join("");

/* 分类卡片 */
$("#cats").innerHTML = SITE.cats.map(cat=>`
  <section style="margin:22px 0 6px">
    <h2 style="font-size:15.5px;margin:22px 0 12px">${esc(cat.name)}</h2>
    <div class="grid">
      ${cat.items.map(it=>`
        <article class="card">
          <div class="hd"><h4>${esc(it.name)}</h4>${it.region?`<span class="badge">${esc(it.region)}</span>`:""}</div>
          ${it.amount?`<span class="amount">福利小计 · ${esc(it.amount)}</span>`:""}
          ${it.channel?`<div class="row"><span class="k">开户</span>${esc(it.channel)}</div>`:""}
          ${it.condition?`<div class="row"><span class="k">条件</span>${esc(it.condition)}</div>`:""}
          ${it.advantage?`<div class="row"><span class="k">优势</span>${esc(it.advantage)}</div>`:""}
          ${it.code?`<span class="ccode" data-code="${esc(it.code)}">邀请码 ${esc(it.code)}</span>`:""}
          ${(it.links&&it.links.length)?`<div class="links">${it.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>`:""}
          ${it.note?`<details><summary>备注</summary><p>${esc(it.note)}</p></details>`:""}
        </article>`).join("")}
    </div>
  </section>`).join("");

$("#footer").textContent = SITE.footer;

/* 复制 */
function flash(el,t){const o=el.textContent;el.textContent=t;setTimeout(()=>el.textContent=o,900);}
$("#vpnCode").onclick = () => { navigator.clipboard&&navigator.clipboard.writeText(v.code); flash($("#vpnCode"),"已复制"); };
document.querySelectorAll(".ccode").forEach(el=>el.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(el.dataset.code);flash(el,"已复制");});
</script>

<!-- 本地预览自动刷新：仅本机打开时生效，上线不影响 -->
<script>
if (["127.0.0.1","localhost"].includes(location.hostname)) {
  let __lm = null;
  setInterval(async () => {
    try {
      const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
      const lm = r.headers.get("last-modified");
      if (__lm && lm && lm !== __lm) location.reload();
      __lm = lm;
    } catch (e) {}
  }, 1500);
}
</script>
