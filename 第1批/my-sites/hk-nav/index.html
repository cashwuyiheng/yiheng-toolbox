<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>港卡 · 券商 · Web3 服务导航</title>
<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --ink:#1e1c18; --muted:#726c63;
    --line:#e7e3dc; --accent:#2f6b57; --accent-soft:#e9f2ee;
    --gold:#a8701f; --gold-soft:#fbf3e2; --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}

  /* 顶部 */
  header.top{padding:46px 0 8px; text-align:center}
  h1.title{font-family:"Noto Serif SC",Georgia,"Songti SC",serif; font-size:30px; margin:0 0 10px; letter-spacing:.5px; font-weight:700}
  .sub{color:var(--muted); font-size:14px; margin:0}
  .searchbar{margin:24px auto 0; max-width:520px; position:relative}
  .searchbar input{
    width:100%; padding:12px 18px 12px 44px; border:1px solid var(--line);
    border-radius:999px; background:#fff; font-size:15px; color:var(--ink); outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .searchbar input:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
  .searchbar svg{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted)}

  .banner{
    max-width:760px; margin:20px auto 0; background:#fffaf0; border:1px solid #f0e2c8;
    color:#7a5a1c; border-radius:12px; padding:10px 16px; font-size:13px; text-align:center;
  }

  /* 分类筛选 */
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:22px 0 4px}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--muted);
    padding:6px 15px; border-radius:999px; font-size:13px; cursor:pointer;
    transition:all .18s; user-select:none;
  }
  .chip:hover{color:var(--ink)}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}

  /* 分类区块 */
  section.cat{margin:30px 0 8px}
  .cat-title{display:flex; align-items:center; gap:10px; font-size:15.5px; font-weight:600; margin:0 0 14px}
  .cat-title::before{content:""; width:4px; height:17px; background:var(--accent); border-radius:2px}
  .cat-title .count{color:var(--muted); font-weight:400; font-size:13px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}

  /* 卡片 */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; display:flex; flex-direction:column; gap:9px;
    transition:box-shadow .2s, transform .2s, border-color .2s;
  }
  .card:hover{box-shadow:0 10px 26px -14px rgba(0,0,0,.20); border-color:#ddd8cf}
  .card .head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .card h3{margin:0; font-size:16.5px}
  .badge{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-weight:400}
  .amount{align-self:flex-start; font-size:12.5px; color:var(--gold); background:var(--gold-soft); border-radius:8px; padding:3px 9px; font-weight:600}
  .row{font-size:13px; color:#3a3630}
  .row .k{color:var(--muted); font-weight:500; margin-right:5px}
  .code{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft);
    color:var(--accent); border-radius:8px; padding:3px 9px; font-size:12.5px;
    cursor:pointer; font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;
    border:1px solid transparent; transition:border-color .15s;
  }
  .code:hover{border-color:var(--accent)}
  .links{display:flex; gap:8px; flex-wrap:wrap; margin-top:1px}
  .links a{
    font-size:12.5px; color:var(--accent); text-decoration:none;
    border:1px solid var(--accent-soft); padding:3px 11px; border-radius:8px; transition:background .15s;
  }
  .links a:hover{background:var(--accent-soft)}
  details.note{font-size:12.5px; color:var(--muted)}
  details.note summary{cursor:pointer; outline:none; list-style:none}
  details.note summary::-webkit-details-marker{display:none}
  details.note summary::before{content:"› "; color:var(--accent); font-weight:700}
  details.note[open] summary::before{content:"⌄ "}
  details.note p{margin:6px 0 0; padding-left:12px}

  .empty{text-align:center; color:var(--muted); padding:60px 0; font-size:14px}

  footer{padding:34px 0 56px; text-align:center; color:var(--muted); font-size:12.5px; border-top:1px solid var(--line); margin-top:36px}
  footer .dot{margin:0 8px; opacity:.5}
</style>

/* =========================================================
   ② 渲染逻辑：一般不用动
   ========================================================= */
const $ = s => document.querySelector(s);
let activeCat = "全部";

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function chipNames(){ return ["全部", ...SITE.categories.map(c => c.name)]; }

function renderChips(){
  $("#chips").innerHTML = chipNames().map(n =>
    `<span class="chip${n===activeCat?' active':''}" data-cat="${esc(n)}">${esc(n)}</span>`
  ).join("");
  document.querySelectorAll(".chip").forEach(el => {
    el.onclick = () => { activeCat = el.dataset.cat; renderChips(); render(); };
  });
}

function cardHTML(it){
  const links = (it.links||[]).map(l =>
    `<a href="${esc(l.url||'#')}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  return `
    <article class="card">
      <div class="head">
        <h3>${esc(it.name)}</h3>
        ${it.region ? `<span class="badge">${esc(it.region)}</span>` : ""}
      </div>
      ${it.amount ? `<span class="amount">福利小计 · ${esc(it.amount)}</span>` : ""}
      ${it.channel ? `<div class="row"><span class="k">开户</span>${esc(it.channel)}</div>` : ""}
      ${it.condition ? `<div class="row"><span class="k">条件</span>${esc(it.condition)}</div>` : ""}
      ${it.advantage ? `<div class="row"><span class="k">优势</span>${esc(it.advantage)}</div>` : ""}
      ${it.code ? `<span class="code" data-code="${esc(it.code)}" title="点击复制">邀请码 ${esc(it.code)}</span>` : ""}
      ${links ? `<div class="links">${links}</div>` : ""}
      ${it.note ? `<details class="note"><summary>备注</summary><p>${esc(it.note)}</p></details>` : ""}
    </article>`;
}

function render(){
  const q = ($("#search").value || "").trim().toLowerCase();
  let html = "", total = 0;

  SITE.categories.forEach(cat => {
    if (activeCat !== "全部" && activeCat !== cat.name) return;
    const items = cat.items.filter(it => {
      if (!q) return true;
      const blob = [it.name,it.region,it.channel,it.condition,it.advantage,it.note,it.code].join(" ").toLowerCase();
      return blob.includes(q);
    });
    if (!items.length) return;
    total += items.length;
    html += `<section class="cat">
      <h2 class="cat-title">${esc(cat.name)}<span class="count">${items.length}</span></h2>
      <div class="grid">${items.map(cardHTML).join("")}</div>
    </section>`;
  });

  $("#main").innerHTML = html || `<div class="empty">没有匹配的结果，换个关键词试试。</div>`;

  document.querySelectorAll(".code").forEach(el => {
    el.onclick = () => {
      const t = el.dataset.code;
      navigator.clipboard && navigator.clipboard.writeText(t);
      const old = el.textContent;
      el.textContent = "已复制";
      setTimeout(() => el.textContent = old, 900);
    };
  });
}

// 初始化
$("#siteTitle").textContent = SITE.title;

$("#banner").textContent = SITE.banner;
$("#banner").style.display = SITE.banner ? "" : "none";
$("#footer").innerHTML = `${esc(SITE.notice)}<span class="dot">·</span>${esc(SITE.updated)}`;
$("#search").oninput = render;
renderChips();

</script>
